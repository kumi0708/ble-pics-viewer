<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030504">
  <meta name="description" content="高度化PICSの歩行信号を、横断者の視界に重ねるAR端末シミュレーター。">
  <title>PICS AR 横断支援端末</title>
  <link rel="stylesheet" href="guide.css?v=20261125-5">
  <script type="module" src="guide.mjs?v=20261125-5"></script>
</head>
<body data-condition="nominal">
  <canvas id="xr-layer" aria-hidden="true"></canvas>

  <main class="ar-terminal" aria-label="PICS AR横断支援端末">
    <div class="simulated-view" aria-hidden="true">
      <div class="skyline skyline-left"></div>
      <div class="skyline skyline-right"></div>
      <div class="road-plane"></div>
      <div class="crosswalk-plane"></div>
      <div class="curb curb-left"></div>
      <div class="curb curb-right"></div>
    </div>

    <div class="view-shade" aria-hidden="true"></div>
    <div class="scan-line" aria-hidden="true"></div>

    <header class="ar-header">
      <a class="system-name" href="guide.html" aria-label="PICS AR端末を再読み込み">
        <span class="system-mark" aria-hidden="true"></span>
        <span><strong>PICS / AR</strong><small>PEDESTRIAN VIEW</small></span>
      </a>
      <div class="link-state">
        <span class="rx-dot" aria-hidden="true"></span>
        <span>BLE RX</span>
        <strong id="rx-time">--:--:--</strong>
      </div>
      <div class="target-id"><span>TARGET</span><strong>00000001</strong></div>
    </header>

    <div class="edge-label edge-left" aria-hidden="true">ADVANCED PICS · TYPE 02 · 0x01CE</div>
    <div class="edge-label edge-right" aria-hidden="true">RECEIVE ONLY · DEMO DATA</div>

    <section class="sight" aria-labelledby="verdict-jp">
      <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <button class="signal-target signal-target-one" data-signal="0" type="button" aria-label="信号1を切り替える">
        <span class="target-leader" aria-hidden="true"></span>
        <span class="target-box">
          <small>SIGNAL 01</small>
          <strong data-signal-label="0">青</strong>
          <b data-signal-remaining="0">08</b>
        </span>
      </button>

      <button class="signal-target signal-target-two" data-signal="1" type="button" aria-label="信号2を切り替える">
        <span class="target-leader" aria-hidden="true"></span>
        <span class="target-box">
          <small>SIGNAL 02</small>
          <strong data-signal-label="1">赤</strong>
          <b data-signal-remaining="1">08</b>
        </span>
      </button>

      <div class="route-guide" aria-hidden="true">
        <span class="route-line"></span>
        <span class="route-chevron chevron-a"></span>
        <span class="route-chevron chevron-b"></span>
        <span class="route-chevron chevron-c"></span>
      </div>

      <div class="verdict" aria-live="polite">
        <p>PEDESTRIAN SIGNAL VERDICT</p>
        <h1 id="verdict-jp">横断許可</h1>
        <div class="verdict-detail">
          <strong id="verdict-en">ROUTE S1 / WALK</strong>
          <span id="verdict-count">残り 08</span>
        </div>
      </div>
    </section>

    <aside class="telemetry" aria-label="受信状態">
      <div><span>TYPE</span><strong>02</strong></div>
      <div><span>S1</span><strong id="s1-code">73</strong></div>
      <div><span>S2</span><strong id="s2-code">71</strong></div>
      <div class="phase-readout"><span>PHASE</span><strong id="phase-number">00</strong></div>
    </aside>

    <div class="interaction-hint" id="interaction-hint">信号マーカーをタップして状態を確認</div>

    <nav class="ar-controls" aria-label="AR端末操作">
      <button id="auto-play" type="button" aria-pressed="false"><span>AUTO</span><strong>自動走査</strong></button>
      <button id="next-state" type="button"><span>STEP</span><strong>次の状態</strong></button>
      <button id="xr-toggle" class="xr-button" type="button" aria-pressed="false"><span>XR</span><strong>ARを起動</strong><small id="xr-status">CHECKING</small></button>
    </nav>

    <div class="safe-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </main>

  <p id="xr-notice" class="xr-notice" role="status" hidden></p>
</body>
</html>
