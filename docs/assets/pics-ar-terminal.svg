<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PICS AR 横断支援端末</title>
  <desc id="desc">暗い交差点の視界に歩行信号と横断許可を重ねたAR端末画面</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b15"/>
      <stop offset=".48" stop-color="#080d0a"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#55ef96" stop-opacity="0"/>
      <stop offset=".2" stop-color="#55ef96"/>
      <stop offset="1" stop-color="#55ef96" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#000" stroke-opacity=".28"/>
    </pattern>
    <pattern id="crossing" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="58" height="54" fill="#dfe5d5" fill-opacity=".36"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 300V112h140v84h92V66h208v150h174V128h166v172z" fill="#101813"/>
  <path d="M900 300V92h182v128h94V42h210v166h214v92z" fill="#0e1511"/>
  <path d="M0 301H1600V900H0z" fill="#0a0f0c"/>
  <path d="M662 302H938L1355 900H245z" fill="#111814"/>
  <path d="M760 302H840L1035 900H565z" fill="url(#crossing)" opacity=".85"/>
  <path d="M799 302V900" stroke="#e8d786" stroke-opacity=".18" stroke-width="5"/>

  <g stroke="#ff8a00" fill="none">
    <path d="M24 24H1576" stroke-width="2"/>
    <path d="M44 142V86h64M1492 86h64v56M44 752v62h64M1492 814h64v-62" stroke-width="3"/>
  </g>

  <g transform="translate(36 42)">
    <rect x="2" y="2" width="20" height="20" transform="rotate(45 12 12)" stroke="#ff8a00" stroke-width="3" fill="none"/>
    <rect x="9" y="9" width="6" height="6" transform="rotate(45 12 12)" fill="#ff8a00"/>
    <text x="38" y="15" fill="#ff8a00" font-family="Arial Narrow, sans-serif" font-size="24" font-weight="700">PICS / AR</text>
    <text x="38" y="32" fill="#7d8d82" font-family="monospace" font-size="10" letter-spacing="2">PEDESTRIAN VIEW</text>
  </g>

  <g font-family="monospace" font-size="12">
    <circle cx="728" cy="58" r="5" fill="#55ef96" filter="url(#glow)"/>
    <text x="744" y="62" fill="#9ba99f" letter-spacing="2">BLE RX</text>
    <text x="814" y="62" fill="#ecece2">09:57:23</text>
    <text x="1460" y="48" text-anchor="end" fill="#ff8a00" font-size="10" letter-spacing="2">TARGET</text>
    <text x="1460" y="69" text-anchor="end" fill="#ecece2" font-size="16">00000001</text>
  </g>

  <g transform="translate(306 196)">
    <path d="M164 42l92 35" stroke="#ff8a00"/>
    <rect x="252" y="73" width="9" height="9" transform="rotate(45 256.5 77.5)" stroke="#ff8a00" fill="#030504"/>
    <rect width="172" height="90" fill="#030504" fill-opacity=".82" stroke="#ff8a00"/>
    <text x="13" y="20" fill="#ff8a00" font-family="monospace" font-size="10" letter-spacing="2">SIGNAL 01</text>
    <text x="13" y="70" fill="#55ef96" font-family="serif" font-size="42" font-weight="900">青</text>
    <text x="134" y="70" fill="#ecece2" font-family="monospace" font-size="28">08</text>
  </g>

  <g transform="translate(1124 148)">
    <path d="M0 61l-104 34" stroke="#ff8a00"/>
    <rect x="-108" y="91" width="9" height="9" transform="rotate(45 -103.5 95.5)" stroke="#ff8a00" fill="#030504"/>
    <rect width="172" height="90" fill="#030504" fill-opacity=".82" stroke="#ff8a00"/>
    <text x="13" y="20" fill="#ff8a00" font-family="monospace" font-size="10" letter-spacing="2">SIGNAL 02</text>
    <text x="13" y="70" fill="#ff443a" font-family="serif" font-size="42" font-weight="900">赤</text>
    <text x="134" y="70" fill="#ecece2" font-family="monospace" font-size="28">08</text>
  </g>

  <g opacity=".45" stroke="#ff8a00" fill="none">
    <path d="M746 225h18v-18M854 225h-18v-18M746 315h18v18M854 315h-18v18"/>
    <path d="M746 270h108M800 207v126" opacity=".5"/>
  </g>

  <g stroke="#55ef96" fill="none" stroke-width="7" filter="url(#glow)">
    <path d="M800 870V470" stroke="url(#route)"/>
    <path d="M765 776l35-35 35 35M765 680l35-35 35 35M765 584l35-35 35 35"/>
  </g>

  <g transform="translate(72 570)">
    <rect width="10" height="184" fill="#55ef96"/>
    <text x="28" y="18" fill="#ff8a00" font-family="monospace" font-size="11" letter-spacing="2">PEDESTRIAN SIGNAL VERDICT</text>
    <text x="24" y="125" fill="#55ef96" font-family="serif" font-size="112" font-weight="900" letter-spacing="-10">横断許可</text>
    <rect x="25" y="146" width="184" height="30" fill="#55ef96"/>
    <text x="38" y="166" fill="#030504" font-family="monospace" font-size="14" font-weight="700">ROUTE S1 / WALK</text>
    <text x="228" y="167" fill="#ecece2" font-family="monospace" font-size="16">残り 08</text>
  </g>

  <g transform="translate(1276 594)" font-family="monospace">
    <path d="M0 0H244" stroke="#ff8a00"/>
    <text x="8" y="24" fill="#ff8a00" font-size="9">TYPE</text>
    <text x="82" y="24" fill="#ff8a00" font-size="9">S1</text>
    <text x="150" y="24" fill="#ff8a00" font-size="9">S2</text>
    <text x="8" y="48" fill="#ecece2" font-size="16">02</text>
    <text x="82" y="48" fill="#ecece2" font-size="16">73</text>
    <text x="150" y="48" fill="#ecece2" font-size="16">71</text>
    <rect y="67" width="244" height="56" fill="#030504" fill-opacity=".8" stroke="#ff8a00"/>
    <text x="10" y="101" fill="#ff8a00" font-size="10">PHASE</text>
    <text x="224" y="108" text-anchor="end" fill="#ff8a00" font-size="42">00</text>
  </g>

  <rect width="1600" height="900" fill="url(#scan)"/>
  <path d="M24 838H904" stroke="#ff8a00" stroke-opacity=".38"/>
  <g transform="translate(904 838)" font-family="sans-serif">
    <rect width="184" height="62" fill="#030504" stroke="#ff8a00" stroke-opacity=".32"/>
    <text x="16" y="39" fill="#ff8a00" font-family="monospace" font-size="11">AUTO</text>
    <text x="68" y="39" fill="#ecece2" font-size="16" font-weight="700">自動走査</text>
    <rect x="184" width="184" height="62" fill="#030504" stroke="#ff8a00" stroke-opacity=".32"/>
    <text x="200" y="39" fill="#ff8a00" font-family="monospace" font-size="11">STEP</text>
    <text x="252" y="39" fill="#ecece2" font-size="16" font-weight="700">次の状態</text>
    <rect x="368" width="304" height="62" fill="#030504" stroke="#ff8a00" stroke-width="2"/>
    <rect x="368" width="6" height="62" fill="#ff8a00"/>
    <text x="390" y="39" fill="#ff8a00" font-family="monospace" font-size="11">XR</text>
    <text x="430" y="39" fill="#ecece2" font-size="19" font-weight="700">ARを起動</text>
    <text x="580" y="39" fill="#738078" font-family="monospace" font-size="9">AR READY</text>
  </g>
</svg>
